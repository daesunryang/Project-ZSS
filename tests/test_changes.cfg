# Which tests a changed file asks for (docs/12 §9.2). Read by
# tools/test_changed.sh; checked by tests/unit/test_tiers_test.gd.
#
#   <pattern> <target> [<target> ...]
#
# <pattern> is an extended regular expression matched against the path from
# the project root ("scripts/domain/combat/combat_service.gd"). EVERY line
# that matches a changed path counts; a path no line matches is "unknown"
# and asks for p0.
#
# Targets:
#   none      nothing (documents)
#   p0        only the P0 tier (every code change gets P0 anyway)
#   all       every test file
#   bot       the headless combat bot (tests/scenarios/combat_bot_test.gd)
#   self      the changed file itself (a test file)
#   <text>    every test file whose path contains <text>
#             ("combat_" -> tests/unit/combat_rules_test.gd, ...)
# A path that has any target other than "none" is a code change: the P0
# tier and the smoke test run as well.

# --- documents: nothing heavy
^docs/ none
^notes/ none
\.md$ none
^\.gitignore$ none
^\.claude/ none
# Godot's id file beside a script or scene: the script itself is listed too
\.uid$ none

# --- the tests and the tools
^tests/(unit|integration|scenarios)/[^/]+_test\.gd$ self
^tests/framework/ all
^tests/run_tests\.gd$ all
^tests/test_(tiers|changes)\.cfg$ test_tiers_test
^tests/bot/ bot combat_bot_policy_test
^tools/ test_tiers_test
# --- the art loop (docs/19) and the performance bench (docs/18)
^art/ art_
^tools/art_ art_
^tools/perf_(bench|client) perf_bench_digest

# --- combat, zombies, survival, navigation, posture: their tests + the bot
