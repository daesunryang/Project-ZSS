# Which tests a changed file asks for (docs/12 §9.2). Read by
# tools/test_changed.sh; checked by tests/unit/test_tiers_test.gd.
#
#   <pattern> <target> [<target> ...]
#
# <pattern> is an extended regular expression matched against the path from
# the project root ("scripts/domain/combat/combat_service.gd"). EVERY line
# that matches a changed path counts; a path no line matches is "unknown"
# and asks for p0.
#
# Targets:
#   none      nothing (documents)
#   p0        only the P0 tier (every code change gets P0 anyway)
#   all       every test file
#   bot       the headless combat bot (tests/scenarios/combat_bot_test.gd)
#   self      the changed file itself (a test file)
#   <text>    every test file whose path contains <text>
#             ("combat_" -> tests/unit/combat_rules_test.gd, ...)
# A path that has any target other than "none" is a code change: the P0
# tier and the smoke test run as well.

# --- documents: nothing heavy
^docs/ none
^notes/ none
\.md$ none
^\.gitignore$ none
# Godot's id file beside a script or scene: the script itself is listed too
\.uid$ none

# --- the tests and the tools
^tests/(unit|integration|scenarios)/[^/]+_test\.gd$ self
^tests/framework/ all
^tests/run_tests\.gd$ all
^tests/test_(tiers|changes)\.cfg$ test_tiers_test
^tests/bot/ bot combat_bot_policy_test
^tools/ test_tiers_test

# --- combat, zombies, survival, navigation, posture: their tests + the bot
^scripts/domain/combat/ combat_ phase2_acceptance bot
^resources/definitions/melee_weapons/ combat_ bot
^scripts/domain/zombie/ zombie /noise_ bot
^scripts/domain/survival/ survival_ bandage cure_ treat_ /rest_ sleep_tuning permanent_death consum bot
^scripts/domain/navigation/ navigation grid_path bot
^scripts/domain/posture/ posture bot
^scripts/domain/noise/ noise zombie bot
^scripts/domain/player_noise/ noise zombie bot
^scripts/domain/player/movement_rules\.gd$ movement bot
^scripts/services/multiplayer/(client_)?combat_ combat_ bot
^scripts/services/multiplayer/(client_)?zombie_ zombie bot
^scripts/services/multiplayer/(client_)?survival_ survival_ /rest_ sleep_tuning permanent_death bot
^scripts/services/multiplayer/(client_)?posture_ posture bot
^data/tuning/(combat|combat_net|zombie|zombie_net|survival|survival_net|navigation|posture|posture_net|noise|player_noise|gameplay)_settings\.tres$ bot
^data/tuning/combat combat_
^data/tuning/zombie zombie
^data/tuning/survival survival_ /rest_ sleep_tuning
^data/tuning/navigation navigation
^data/tuning/posture posture
^data/tuning/(noise|player_noise) noise

# --- saving
^scripts/services/save/ save persistence
^scripts/domain/world_cells/ world_cell persistence
^scripts/services/world/world_cell world_cell persistence
^data/tuning/world_cell world_cell

# --- everything rides on these
^project\.godot$ all
^scripts/core/ all
^scripts/services/world/(server_world|server_system|game_world)\.gd$ all
^scripts/services/multiplayer/(network_service|net_module|intent_validator|rate_limiter|network_settings)\.gd$ tests/integration/ tests/scenarios/
^data/tuning/(network|world_clock|app)_settings\.tres$ tests/integration/ tests/scenarios/

# --- the other domains
^scripts/domain/building/ building_ structure_ construction_ storage_box map_ zombie_navigation
^scripts/services/multiplayer/(client_)?structure_ structure_ construction_
^resources/definitions/structures/ building_ structure_ construction_ storage_box
^data/tuning/(building|structure) building_ structure_ construction_
^scripts/domain/containers/ container_ loot_ storage_box
^scripts/services/multiplayer/(client_)?container_ container_
^resources/definitions/(containers|loot_tables)/ container_ loot_
^data/tuning/container container_
^scripts/domain/inventory/ inventory_ item_ ground_transfer consum trade_ container_
^scripts/services/multiplayer/inventory_ inventory_ ground_transfer consum bandage cure_ treat_
^resources/definitions/items/ inventory_ item_ consum bandage cure_ combat_
^data/tuning/inventory inventory_
^scripts/domain/trade/ trade_
^scripts/services/multiplayer/(client_)?trade_ trade_
^data/tuning/trade trade_
^scripts/domain/map_content/ map_
^scripts/services/world/map_content map_
^resources/definitions/maps/ map_ phase3_acceptance bot
^scripts/domain/entity/ entity_registry
^scripts/domain/player/ character_ movement
^scripts/services/multiplayer/(client_)?character_ character_
^resources/definitions/appearance/ character_
^data/tuning/character character_
^scripts/services/multiplayer/(cell_interest|interest_|world_cell_net|client_world_map) interest world_cell_net world_map
^data/tuning/interest interest
