# Test tiers (docs/12 §9.1). One line per test file: <tier> <path>.
#   p0 = "깨지면 게임이 안 되는 것": the game starts, a client connects and
#        joins, the world is saved and restored, forged requests are refused,
#        core transactions hold (inventory conservation, ids), and the
#        Phase 1/2/3 acceptance scenarios pass.
#   p1 = everything else ("게임 전반").
# Every *_test.gd under tests/unit, tests/integration and tests/scenarios
# must be here exactly once (tests/unit/test_tiers_test.gd checks it).
# Read by tests/run_tests.gd (--tier=) and tools/test_changed.sh.
# Keep P0 to a few minutes: a new file is p1 unless it guards one of the
# things above.

